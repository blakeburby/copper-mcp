<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Jim Halpert</title>
<link rel="stylesheet" href="./_copper.css"/></head>
<body>
  <!--
    Mirrors the REAL Copper activity feed captured live 2026-07-24 by logging a
    Phone Call on a record. Note <time datetime> carries a full ISO-8601 UTC
    instant — that is the authoritative timestamp; "2:30 PM" is display only.
  -->
  <div class="WebAppMain"><div class="WebAppContent">
    <div class="ActivityList ember-view">
      <div class="ActivityLogList ember-view">

        <div class="ActivityItem ActivityItem-note is-labeled ember-view">
          <h4 class="ActivityItem_label">Today</h4>
          <div class="ActivityItem_container fs-mask">
            <div class="ActivityItem_contentSection"><div class="ActivityItem_contentWrapper">
              <div class="ActivityItem_header withPill u-ellipsis">
                <span class="ActivityItem_headerContent"><a class="ember-view">You</a> logged a Phone Call</span>
              </div>
              <div class="ActivityItem_date">
                <time datetime="2026-07-24T21:30:39.000Z" title="Jul 24, 2026 at 2:30 PM">2:30 PM</time>
              </div>
            </div></div>
          </div>
        </div>

        <div class="ActivityItem ActivityItem-note ember-view">
          <div class="ActivityItem_container fs-mask">
            <div class="ActivityItem_contentSection"><div class="ActivityItem_contentWrapper">
              <div class="ActivityItem_header withPill">
                <span class="ActivityItem_headerContent"><a class="ember-view">Jim Halpert</a> replied to your email</span>
              </div>
              <div class="ActivityItem_date">
                <time datetime="2026-07-23T16:05:00.000Z" title="Jul 23, 2026 at 9:05 AM">9:05 AM</time>
              </div>
            </div></div>
          </div>
        </div>

        <div class="ActivityItem ember-view">
          <div class="ActivityItem_container fs-mask">
            <div class="ActivityItem_contentSection"><div class="ActivityItem_contentWrapper">
              <div class="ActivityItem_header withPill">
                <span class="ActivityItem_headerContent"><a class="ember-view">You</a> added this Person</span>
              </div>
              <div class="ActivityItem_date">
                <time datetime="2026-07-24T20:52:41.000Z" title="Jul 24, 2026 at 1:52 PM">1:52 PM</time>
              </div>
            </div></div>
          </div>
        </div>

        <!--
          Auto-logged EMAIL (correspondence), mirroring the real Miniac DOM
          captured live 2026-07-28: sender is an internal user (pill link has NO
          href), recipient is the CONTACT (pill is an <a> to /#/contact/<id>).
          Direction is read from the parties, not text: contact = recipient →
          OUTBOUND.
        -->
        <div class="ActivityItem ActivityItem-correspondence is-labeled ember-view">
          <div class="ActivityItem_container fs-mask">
            <div class="ActivityItem_contentSection"><div class="ActivityItem_contentWrapper">
              <div class="ActivityItem_header withPill ActivityItem_header-emailHeader">
                <span class="ActivityItem_headerContent correspondence">
                  <span class="AvatarPill ActivityItem_senderPill"><a class="ember-view">Stephen Roesler</a></span>
                  to
                  <a class="AvatarPill-emailLink ActivityItem_firstRecipientPill ember-view"
                     href="https://app.copper.com/companies/601304/app/#/contact/181129772">Abbi Lewis</a>
                </span>
              </div>
              <div class="ActivityItem_date">
                <time datetime="2026-03-16T16:33:00.000Z" title="Mar 16, 2026 at 12:33 PM">12:33 PM</time>
              </div>
              <div class="ActivityItem_content u-ellipsis"><span class="ActivityItem_subject u-ellipsis"><span class="ActivityItem_subjectText">don't let your ideas get killed in the room</span></span></div>
            </div></div>
          </div>
        </div>

      </div>
    </div>
  </div></div>
</body></html>
