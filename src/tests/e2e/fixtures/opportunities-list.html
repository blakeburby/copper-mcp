<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opportunities</title>
    <link rel="stylesheet" href="./_copper.css" />
  </head>
  <body>
    <!-- Mirrors the real Copper Opportunities list table (captured 2026-07-24). Fictional data. -->
    <div class="WebAppNav">
      <div class="WebAppNav_brand">Blake Burby's Company</div>
      <a href="#/feed">Feed</a>
      <a href="#/browse/list/tasks/default">Tasks</a>
      <div class="WebAppNav_section">Contacts</div>
      <a href="#/browse/list/people/default">People</a>
      <a href="#/browse/list/companies/default">Companies</a>
    </div>

    <div class="WebAppMain">
      <div class="WebAppHeader">
        <h1 class="WebAppHeader_title">Opportunities</h1>
        <div class="WebAppHeader_search">
          <input type="text" class="GlobalSearchTypeAhead_textField"
                 placeholder="Search by name, email, domain or phone number" />
        </div>
      </div>

      <div class="WebAppContent">
        <table class="ListViewTable">
          <thead>
            <tr class="et-tr ember-view">
              <th>Opportunity</th><th>Company</th><th>Stage</th><th>Value</th>
            </tr>
          </thead>
          <tbody class="ember-view ListViewTableBody">
            <tr class="et-tr ember-view">
              <td class="is-fixed-left ember-view">
                <div class="browse_field CardinalField"><div class="CardinalField_read">
                  <a class="ember-view fullProfileLink" href="#/browse/list/opportunities/default?fullProfile=opportunities-99120001">
                    <div class="AvatarPill"><span class="AvatarPill_text">Paper renewal — Dunder Mifflin</span></div>
                  </a>
                </div></div>
              </td>
              <td>Dunder Mifflin</td><td>Won</td><td>$42,000</td>
            </tr>
            <tr class="et-tr ember-view">
              <td class="is-fixed-left ember-view">
                <div class="browse_field CardinalField"><div class="CardinalField_read">
                  <a class="ember-view fullProfileLink" href="#/browse/list/opportunities/default?fullProfile=opportunities-99120002">
                    <div class="AvatarPill"><span class="AvatarPill_text">New account — Vance Refrigeration</span></div>
                  </a>
                </div></div>
              </td>
              <td>Vance Refrigeration</td><td>Negotiation</td><td>$18,500</td>
            </tr>
            <tr class="et-tr ember-view">
              <td class="is-fixed-left ember-view">
                <div class="browse_field CardinalField"><div class="CardinalField_read">
                  <a class="ember-view fullProfileLink" href="#/browse/list/opportunities/default?fullProfile=opportunities-99120003">
                    <div class="AvatarPill"><span class="AvatarPill_text">Bulk order — Utica Paper Group</span></div>
                  </a>
                </div></div>
              </td>
              <td>Utica Paper Group</td><td>Qualified</td><td>$67,250</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
