<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jim Halpert</title>
    <link rel="stylesheet" href="./_copper.css" />
  </head>
  <body>
    <!--
      Person "full profile" panel, mirroring live Copper (captured 2026-07-24):
        * Container class EntityFullProfileFrame-fullProfile.
        * Field values live in inline-editable <input> VALUES keyed by
          placeholder ("Add Name", "Add Title", ...), NOT in text nodes — so
          extraction must use inputValue(), which is what BasePage.valueOf does.
        * <label> elements carry NO `for` attribute, so getByLabel cannot work.
        * There is NO <h1>/<h2> for the record name; document.title mirrors it.
      Fictional data.
    -->
    <div class="WebAppNav">
      <div class="WebAppNav_brand">Blake Burby's Company</div>
      <a href="#/feed">Feed</a>
      <div class="WebAppNav_section">Contacts</div>
      <a href="#/browse/list/people/default" class="is-active">People</a>
      <a href="#/browse/list/companies/default">Companies</a>
    </div>

    <div class="WebAppMain">
      <div class="WebAppHeader">
        <div class="WebAppHeader_search">
          <input type="text" class="GlobalSearchTypeAhead_textField"
                 placeholder="Search by name, email, domain or phone number" />
        </div>
      </div>

      <div class="WebAppContent">
        <div class="EntityFullProfileFrame-fullProfile EntityFullProfileFrame-contact">
          <div class="RecordDetail">
            <div class="RecordDetail_fields">
              <label class="RecordDetail_label">Name</label>
              <input class="TextField-inlineEditable ember-text-field" placeholder="Add Name" value="Jim Halpert" />

              <label class="RecordDetail_label">Company</label>
              <input class="TextField-inlineEditable ember-text-field" placeholder="Add Company" value="Dunder Mifflin" />

              <label class="RecordDetail_label">Title</label>
              <input class="TextField-inlineEditable ember-text-field" placeholder="Add Title" value="Sales Representative" />

              <label class="RecordDetail_label">Owner</label>
              <input class="TextField-inlineEditable ember-text-field" placeholder="Add Owner" value="Blake Burby" />

              <label class="RecordDetail_label">Work Email</label>
              <input class="TextField-inlineEditable ember-text-field" placeholder="Add Email" value="jim.halpert@dundermifflin.example" />

              <label class="RecordDetail_label">Work Phone</label>
              <input class="TextField-inlineEditable ember-text-field" placeholder="Add Phone" value="555-0101" />
            </div>

            <div class="EntityField_value">jim.halpert@dundermifflin.example</div>
            <div class="EntityField_value">555-0101</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
