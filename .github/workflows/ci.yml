name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The e2e specs run against local HTML fixtures only — they never reach
      # app.copper.com and need no Copper credentials.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (fixture-backed)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
          if-no-files-found: ignore
